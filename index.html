<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Сканер билетов</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Библиотека для чтения QR-кода -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100%;
            background: #111827;
        }

        /* Верхняя панель как в приложении */
        .top-bar {
            height: 56px;
            background: #020617;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .top-bar button {
            border: none;
            background: transparent;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }

        .top-bar-title {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            text-align: center;
        }

        .top-bar-icon {
            width: 20px;
            text-align: right;
            font-size: 18px;
            opacity: 0.8;
        }

        /* Камера */
        .camera-wrapper {
            position: relative;
            width: 100%;
            height: calc(100vh - 56px - 72px); /* минус верхняя и нижняя панели */
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Жёлтая линия как в приложении */
        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 72px;
            height: 2px;
            background: #facc15;
        }

        /* Нижняя кнопка */
        .bottom-bar {
            height: 72px;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px 20px;
        }

        .manual-btn {
            width: 100%;
            border-radius: 10px;
            border: none;
            background: #1f2937;
            color: #e5e7eb;
            padding: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        .manual-btn:active {
            background: #374151;
        }

        /* Зелёный баннер "БИЛЕТ НАЙДЕН" */
        .ticket-banner {
            position: fixed;
            top: 56px; /* сразу под верхней панелью */
            left: 0;
            right: 0;
            background: #16a34a;
            color: #ecfdf5;
            text-align: center;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            transform: translateY(-110%);
            opacity: 0;
            transition: transform 0.25s ease-out, opacity 0.25s ease-out;
            z-index: 20;
        }

        .ticket-banner.visible {
            transform: translateY(0);
            opacity: 1;
        }

        /* Небольшой оверлей для текста результата (по желанию) */
        .qr-result {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 82px;
            padding: 8px 14px;
            font-size: 12px;
            color: #d1d5db;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <button aria-label="Назад">‹</button>
        <div class="top-bar-title">
            СКАНИРУЙТЕ (QR ИЛИ BAR)-КОД БИЛЕТА
        </div>
        <div class="top-bar-icon">🗑️</div>
    </div>

    <div class="ticket-banner" id="ticketBanner">
        БИЛЕТ НАЙДЕН
    </div>

    <div class="camera-wrapper">
        <video id="video" autoplay playsinline></video>
        <div class="scan-line"></div>
        <div class="qr-result" id="qrResult"></div>
    </div>

    <div class="bottom-bar">
        <button class="manual-btn">Ввести вручную</button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const banner = document.getElementById('ticketBanner');
    const qrResult = document.getElementById('qrResult');

    // !!! ВАЖНО: сюда вставь ПРЯМОЙ .mp3-адрес звука из myinstants
    // Пример: const beepSound = new Audio('https://.../iphone_apple_store.mp3');
    const beepSound = new Audio('https://www.myinstants.com/media/sounds/iphone-apple-store-sound.mp3');

    // чтобы звук не лагал при первом проигрывании
    beepSound.preload = 'auto';

    let lastScanTime = 0;

    function showBanner(text) {
        banner.textContent = text || 'БИЛЕТ НАЙДЕН';
        banner.classList.add('visible');

        setTimeout(() => {
            banner.classList.remove('visible');
        }, 2000);
    }

    function onTicketFound(data) {
        const now = Date.now();
        // Защита от спама: не чаще, чем раз в 3 секунды
        if (now - lastScanTime < 3000) return;
        lastScanTime = now;

        qrResult.textContent = 'Данные QR: ' + data;

        // звук может не сыграть, если браузер ещё не видел действий пользователя
        beepSound.currentTime = 0;
        beepSound.play().catch(() => {
            // если браузер заблокировал автоплей, просто игнорим
        });

        showBanner('БИЛЕТ НАЙДЕН');
    }

    // Запуск камеры
    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: { ideal: 'environment' } // основная камера на телефоне
                },
                audio: false
            });
            video.srcObject = stream;
            scanLoop();
        } catch (err) {
            alert('Не получилось получить доступ к камере: ' + err.message);
        }
    }

    // Сканирование QR-кода
    function scanLoop() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: 'dontInvert'
                });

                if (code) {
                    onTicketFound(code.data);
                }
            }

            requestAnimationFrame(tick);
        }

        requestAnimationFrame(tick);
    }

    // На iOS звук/камера лучше работают после первого тапа,
    // но старт мы всё равно пробуем сразу.
    startCamera();
</script>
</body>
</html>
